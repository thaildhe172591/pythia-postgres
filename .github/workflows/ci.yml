name: ci

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

# pythia-core is private while pre-alpha. GITHUB_TOKEN reaches only this
# repository, so reading pythia-core needs a fine-grained token with read
# access to it, stored as the PYTHIA_CORE_TOKEN secret. Once pythia-core is
# public, the fallback to github.token is enough.

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.9", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/checkout-core
        with:
          token: ${{ secrets.PYTHIA_CORE_TOKEN || github.token }}
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      # nothing to install: the suite stands in for psycopg and finds core's src/
      - run: python -m compileall -q src tests
      - run: python tests/test_postgres.py
        env:
          PYTHIA_CORE_SRC: ${{ github.workspace }}/.core/src

  live:
    # a disposable server per run; never a shared database
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/checkout-core
        with:
          token: ${{ secrets.PYTHIA_CORE_TOKEN || github.token }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install ./.core .
      # the image carries the PGDG apt source; errors is checked without
      # plpgsql_check and then with it
      - name: plpgsql_check into the service container
        run: >-
          docker exec ${{ job.services.postgres.id }} sh -c
          'apt-get update -qq && apt-get install -y -qq postgresql-16-plpgsql-check'
      - run: python tests/live_check.py
        env:
          PYTHIA_PG_LIVE_HOST: 127.0.0.1
          PYTHIA_PG_LIVE_PORT: "5432"
          PYTHIA_PG_LIVE_DB: postgres
          PYTHIA_PG_LIVE_USER: postgres
          PYTHIA_PG_LIVE_PASSWORD: ci-only
          PYTHIA_PG_LIVE_DISPOSABLE: "1"
          PYTHIA_PG_LIVE_PLPGSQL_CHECK: "1"

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/checkout-core
        with:
          token: ${{ secrets.PYTHIA_CORE_TOKEN || github.token }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip wheel . --no-deps -w dist
      - run: pip install ./.core dist/*.whl
      # the console script and the queries must work outside the repo layout
      - run: cd /tmp && pythia-pg version && pythia-pg --help | grep -q impact
      - run: cd /tmp && python -c "from pythia_postgres.catalog import QUERY_BINDS, QUERY_DIR; assert all((QUERY_DIR / q).is_file() for q in QUERY_BINDS)"
      # the skills ship, and install wires a fresh project that doctor passes
      - run: >-
          mkdir /tmp/scratch-project && cd /tmp/scratch-project &&
          pythia-pg install && pythia-pg doctor &&
          test -f .claude/skills/pythia-pg-apply/reference/refusals.md &&
          test -f .agents/skills/using-pythia-pg/SKILL.md
